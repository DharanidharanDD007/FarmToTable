# nginx.conf - Production Load Balancing & Reverse Proxy Template

# Define the user and worker settings
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression to optimize load times for millions of users
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---------------------------------------------------------
    # 1. Load Balancing Pool (Upstream Cluster)
    # Routes incoming traffic round-robin to backend instances
    # ---------------------------------------------------------
    upstream farm_backend {
        server 127.0.0.1:5000 weight=1; # Node process worker port
        server 127.0.0.1:5001 weight=1; # (Optional) Multi-node instance 2
        server 127.0.0.1:5002 weight=1; # (Optional) Multi-node instance 3
        
        # Keep connections alive for performance scaling
        keepalive 32;
    }

    # ---------------------------------------------------------
    # 2. Main Server Configuration
    # ---------------------------------------------------------
    server {
        listen       80;
        server_name  localhost farmtotable.local;

        # Serve Frontend Static Assets (React build folder)
        location / {
            root   ./dist; # Location of vite production build
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # Support React routing
            
            # Cache static assets
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Redirect API Calls to Node.js Backend Cluster
        location /api/ {
            proxy_pass http://farm_backend; # Directs to upstream pool
            
            # Forward headers for secure JWT & cookie authentication
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Bypass Nginx cache for dynamic API endpoints
            proxy_cache_bypass $http_upgrade;
        }

        # Custom Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
